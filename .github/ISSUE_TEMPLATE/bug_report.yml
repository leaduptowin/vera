name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MINUTE. Please do not include real meeting transcripts, API keys or personal data.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Start microphone / add a note ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 136 / Edge 136 / Safari 18 ...
    validations:
      required: true

  - type: dropdown
    id: speech
    attributes:
      label: Speech mode
      options:
        - Microphone / Web Speech API
        - Manual note fallback
        - Not sure

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Drag files here if useful. Remove or blur sensitive content.

  - type: textarea
    id: console
    attributes:
      label: Console errors
      render: shell
